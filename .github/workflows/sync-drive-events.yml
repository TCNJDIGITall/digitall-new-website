name: Sync DIGIT.all Drive event schedule
on:
  schedule:
    # Four daily checks; actual updates happen only when the document changes.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digitall-drive-schedule-sync
  cancel-in-progress: false

jobs:
  sync-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Read published Google Doc and rebuild events
        run: python3 scripts/sync_drive_schedule.py

      - name: Save changes if the schedule was edited
        run: |
          if ! git diff --quiet -- data/events.json; then
            git config user.name "digitall-calendar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/events.json
            git commit -m "Sync website events from DIGIT.all Drive"
            git push
          else
            echo "Event data is already current."
          fi
